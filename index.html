<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DDUC Student Verification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f4f6f9;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .fallback-card {
      max-width: 480px;
      margin: 60px auto;
      padding: 30px 20px;
      background: #ffffff;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      border-top: 5px solid #0d47a1;
    }
    .fallback-card h2 {
      color: #0d47a1;
      margin-bottom: 8px;
      font-size: 1.3rem;
    }
    .fallback-card p {
      color: #555555;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzX46fEKYlD1MAvtUrG1mMh1H5151r8kEjlVxOxpbOkH921sQ-nKaqyWAqa17hQnRxk0g/exec";
    const params = window.location.search;

    if (params && params.includes("t=")) {
      // Load Google Apps Script verification page inside fullscreen iframe
      const iframe = document.createElement("iframe");
      iframe.src = WEB_APP_URL + params;
      iframe.allow = "autoplay";
      document.getElementById("app").appendChild(iframe);
    } else {
      // Display default screen when accessed without QR parameters
      document.getElementById("app").innerHTML = `
        <div class="fallback-card">
          <div class="icon">🔍</div>
          <h2>Deen Dayal Upadhyaya College</h2>
          <p><strong>Student Identity Verification Gateway</strong></p>
          <br>
          <p>Please scan an official student ID card QR code to view and verify record details.</p>
        </div>
      `;
    }
  </script>

</body>
</html>
